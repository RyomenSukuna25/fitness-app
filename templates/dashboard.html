{% extends "base.html" %}

{% block content %}

<h1>🔥 Dashboard</h1>

<div class="card">
    <h2>Current Weight</h2>
    <p>{{ latest }} kg</p>
</div>

<div class="card">
    <h2>🔥 Streak</h2>
    <p>{{ streak }} days</p>
</div>

<div class="card">
    <h3>{{ message }}</h3>
</div>

<div class="card">
    <h3>Add Weight</h3>
    <form method="POST" action="/add_weight">
        <input type="number" step="0.1" name="weight" required>
        <button>Add</button>
    </form>
</div>

<div class="card">
    <h3>📊 Progress Graph</h3>
    <canvas id="weightChart"></canvas>
</div>

<a href="/tracker"><button>Go to Daily Tracker</button></a>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const weights = {{ data | map(attribute='weight') | list | tojson }};
    const labels = weights.map((_, i) => "Day " + (i + 1));

    new Chart(document.getElementById('weightChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Weight',
                data: weights,
                borderWidth: 2
            }]
        }
    });
</script>

{% endblock %}
